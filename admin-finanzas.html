<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finanzas | Trato Justo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
}

header{
height:70px;
background:#1976d2;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
}

.container{
display:flex;
min-height:calc(100vh - 70px);
}

aside{
width:230px;
background:#263238;
}

aside h2{
color:white;
text-align:center;
padding:25px 0;
border-bottom:1px solid rgba(255,255,255,.1);
}

aside a{
display:block;
color:white;
text-decoration:none;
padding:18px 25px;
}

aside a:hover{
background:#1976d2;
}

main{
flex:1;
padding:35px;
}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:35px;

}

.card{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.12);

}

.card h3{

color:#666;
margin-bottom:15px;

}

.numero{

font-size:30px;
font-weight:bold;
color:#1976d2;

}

.busqueda{

display:flex;
gap:10px;
margin-bottom:25px;

}

.busqueda input{

flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:6px;

}

.busqueda button{

padding:12px 20px;
background:#1976d2;
color:white;
border:none;
border-radius:6px;
cursor:pointer;

}

table{

width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.12);

}

th{

background:#1976d2;
color:white;
padding:14px;

}

td{

padding:14px;
border-bottom:1px solid #ddd;
text-align:center;

}
.estadoCreado{

color:#1565c0;
font-weight:bold;

}

.estadoReservado{

color:#ef6c00;
font-weight:bold;

}

.estadoCompletado{

color:#2e7d32;
font-weight:bold;

}

</style>

</head>

<body>

<header>

<h1>TRATO JUSTO</h1>

<div id="adminNombre"></div>

</header>

<div class="container">

<aside>

<h2>Panel</h2>

<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-usuarios.html">👥 Usuarios</a>
<a href="admin-lista-tratos.html">📦 Tratos</a>
<a href="admin-finanzas.html">💰 Finanzas</a>
<a href="admin-configuracion.html">⚙ Configuración</a>
<a href="#" onclick="cerrarSesion()">🚪 Cerrar sesión</a>

</aside>

<main>

<h2>Finanzas</h2>

<div class="cards">

<div class="card">

<h3>Dinero protegido</h3>

<div
class="numero"
id="dineroProtegido">

$0.00

</div>

</div>

<div class="card">

<h3>Comisiones</h3>

<div
class="numero"
id="comisiones">

$0.00

</div>

</div>

<div class="card">

<h3>Dinero liberado</h3>

<div
class="numero"
id="dineroLiberado">

$0.00

</div>

</div>

<div class="card">

<h3>Tratos completados</h3>

<div
class="numero"
id="tratosCompletados">

0

</div>

</div>

</div>

<div class="busqueda">

<input
id="buscar"
placeholder="Buscar por código">

<button onclick="cargarFinanzas()">

Buscar

</button>

</div>

<table>

<thead>

<tr>

<th>Código</th>
<th>Fecha</th>
<th>Monto</th>
<th>Comisión</th>
<th>Monto vendedor</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="tablaFinanzas">

</tbody>

</table>

</main>

</div>
<script>

const token = localStorage.getItem("tokenAdmin");

if(!token){

    window.location.href="admin-login.html";

}

const admin = JSON.parse(atob(token.split(".")[1]));

document.getElementById("adminNombre").innerText = admin.email;

cargarFinanzas();

async function cargarFinanzas(){

    try{

        const texto = document.getElementById("buscar").value.trim();

        const respuesta = await fetch(

            "/admin/finanzas?buscar=" + encodeURIComponent(texto),

            {

                headers:{
                    Authorization:"Bearer " + token
                }

            }

        );

        if(respuesta.status===401){

            localStorage.removeItem("tokenAdmin");

            window.location.href="admin-login.html";

            return;

        }

        if(!respuesta.ok){

            alert("No fue posible cargar las finanzas.");

            return;

        }

        const datos = await respuesta.json();

        document.getElementById("dineroProtegido").innerText =
"$"+Number(datos.resumen.dinero_protegido).toLocaleString("en-US",{minimumFractionDigits:2});

        document.getElementById("comisiones").innerText =
"$"+Number(datos.resumen.comisiones).toLocaleString("en-US",{minimumFractionDigits:2});

        document.getElementById("dineroLiberado").innerText =
"$"+Number(datos.resumen.dinero_liberado).toLocaleString("en-US",{minimumFractionDigits:2});

        document.getElementById("tratosCompletados").innerText =
        datos.resumen.tratos_completados;

        const tabla = document.getElementById("tablaFinanzas");

        tabla.innerHTML="";

        datos.movimientos.forEach(m=>{

            tabla.innerHTML += `

            <tr>

                <td>${m.codigo}</td>

                <td>${m.fecha ?? "-"}</td>

                <td>$${Number(m.monto_protegido).toLocaleString("en-US",{minimumFractionDigits:2})}</td>

<td>$${Number(m.comision).toLocaleString("en-US",{minimumFractionDigits:2})}</td>

<td>$${Number(m.monto_vendedor).toLocaleString("en-US",{minimumFractionDigits:2})}</td>

<td class="${
m.estado==="completado"
? "estadoCompletado"
: m.estado==="reservado"
? "estadoReservado"
: "estadoCreado"
}">
${m.estado}
</td>

            </tr>

            `;

        });

    }

    catch(error){

        console.error(error);

        alert("Error al cargar finanzas.");

    }

}

function cerrarSesion(){

    localStorage.removeItem("tokenAdmin");

    window.location.href="admin-login.html";

}

</script>

</body>
</html>
