<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Ventas - Trato Justo</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet" href="/mis-ventas.css">
</head>

<body>

<div class="header">

    <div class="logo">
        <div class="logo-mark">
            <span class="material-icons">verified_user</span>
        </div>
        Trato Justo
    </div>

    <div class="subtitulo">
        Administra todos tus tratos como vendedor
    </div>

</div>

<div class="container">

    <button
    class="btn btn-secondary"
    data-accion="volver-dashboard">
        <span class="material-icons">arrow_back</span>
    Volver al Inicio
</button>

<div class="filtros">

    <button
    class="filtro-btn"
    data-filtro=""
    data-accion="filtrar">
        Todos
    </button>

    <button
    class="filtro-btn"
    data-filtro="creado"
    data-accion="filtrar">
        Creados
    </button>

    <button
    class="filtro-btn"
    data-filtro="reservado"
    data-accion="filtrar">
        Reservados
    </button>

    <button
    class="filtro-btn"
    data-filtro="completado"
    data-accion="filtrar">
        Completados
    </button>

</div>

<div id="ventas">
        Cargando ventas...
    </div>

</div>

<script src="csrf.js"></script>
<script src="mis-ventas.js"></script>
</body>
</html>
