<body>

<div class="header">

    <div class="logo">
        <div class="logo-mark">
            <span class="material-icons">verified_user</span>
        </div>
        Trato Justo
    </div>

    <div class="subtitulo">
        Administra todos tus tratos como vendedor
    </div>

</div>

<div class="container">

    <button
    class="btn btn-secondary"
    onclick="location.href='dashboard.html'">
    <span class="material-icons">arrow_back</span>
    Volver al Inicio
</button>

<div class="filtros">

    <button
        class="filtro-btn"
        data-filtro=""
        onclick="cambiarFiltro('')">
        Todos
    </button>

    <button
        class="filtro-btn"
        data-filtro="creado"
        onclick="cambiarFiltro('creado')">
        Creados
    </button>

    <button
        class="filtro-btn"
        data-filtro="reservado"
        onclick="cambiarFiltro('reservado')">
        Reservados
    </button>

    <button
        class="filtro-btn"
        data-filtro="completado"
        onclick="cambiarFiltro('completado')">
        Completados
    </button>

</div>

<div id="ventas">
        Cargando ventas...
    </div>

</div>

<script>

const token = localStorage.getItem('token');

if (!token) {

    window.location.href = '/login.html';

}
let ventasTodas = [];
function copiarLink(codigo) {

    const link =
        window.location.origin +
        '/trato/' +
        codigo;

    navigator.clipboard.writeText(link);

    alert('Enlace copiado correctamente');

}
function cambiarFiltro(nuevoFiltro){

    document.querySelectorAll(".filtro-btn").forEach(boton => {

        boton.classList.remove("activo");

        if(boton.dataset.filtro === nuevoFiltro){

            boton.classList.add("activo");

        }

    });

    const ventasFiltradas = nuevoFiltro
        ? ventasTodas.filter(trato => trato.estado === nuevoFiltro)
        : ventasTodas;

    mostrarVentas(ventasFiltradas);

}
function compartirWhatsApp(codigo) {

    const link =
        window.location.origin +
        '/trato/' +
        codigo;

    const mensaje =
        `Hola, te comparto mi trato protegido de Trato Justo:%0A%0A${link}`;

    window.open(
        `https://wa.me/?text=${mensaje}`,
        '_blank'
    );

}
const parametros = new URLSearchParams(window.location.search);
const filtro = parametros.get('filtro');

document.querySelectorAll(".filtro-btn").forEach(boton => {

    if (boton.dataset.filtro === (filtro || "")) {

        boton.classList.add("activo");

    }

});
function mostrarVentas(ventas){

    const contenedor =
        document.getElementById('ventas');

    if(ventas.length === 0){

        contenedor.innerHTML = `
