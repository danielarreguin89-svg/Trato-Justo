<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel de Administración | Trato Justo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

header{

    width:100%;
    height:70px;
    background:#1976d2;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    box-shadow:0 2px 10px rgba(0,0,0,.15);

}

header h1{

    font-size:24px;

}

#adminNombre{

    font-weight:bold;

}

.container{

    display:flex;
    min-height:calc(100vh - 70px);

}

aside{

    width:230px;
    background:#263238;
    color:white;

}

aside h2{

    text-align:center;
    padding:25px 0;
    border-bottom:1px solid rgba(255,255,255,.1);

}

aside a{

    display:block;

    color:white;

    text-decoration:none;

    padding:18px 25px;

    transition:.2s;

}

aside a:hover{

    background:#1976d2;

}

main{

    flex:1;

    padding:35px;

}

main h2{

    margin-bottom:30px;

}

.cards{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}

.card{

    background:white;

    border-radius:12px;

    padding:25px;

    box-shadow:0 2px 10px rgba(0,0,0,.12);

}

.card h3{

    color:#666;

    margin-bottom:20px;

}

.numero{

    font-size:34px;

    font-weight:bold;

    color:#1976d2;

}

@media(max-width:850px){

.container{

    flex-direction:column;

}

aside{

    width:100%;

}

}

</style>

</head>

<body>

<header>

<h1>TRATO JUSTO</h1>

<div>

Administrador:
<span id="adminNombre">Cargando...</span>

</div>

</header>

<div class="container">

<aside>

<h2>Panel</h2>

<a href="admin-dashboard.html">📊 Dashboard</a>

<a href="admin-usuarios.html">👥 Usuarios</a>

<a href="admin-lista-tratos.html">📦 Tratos</a>

<a href="admin-finanzas.html">💰 Finanzas</a>

<a href="admin-configuracion.html">⚙ Configuración</a>
<a href="#" onclick="cerrarSesion()">🚪 Cerrar sesión</a>

</aside>

<main>

<h2>Resumen General</h2>

<div class="cards">

<div class="card">

<h3>Usuarios</h3>

<div class="numero" id="usuarios">0</div>

</div>

<div class="card">

<h3>Tratos</h3>

<div class="numero" id="tratos">0</div>

</div>
<div class="card">

<h3>Tratos creados</h3>

<div
class="numero"
id="tratosCreados">

0

</div>

</div>

<div class="card">

<h3>Tratos reservados</h3>

<div
class="numero"
id="tratosReservados">

0

</div>

</div>

<div class="card">

<h3>Tratos completados</h3>

<div
class="numero"
id="tratosCompletados">

0

</div>

</div>

<div class="card">

<h3>Dinero protegido</h3>

<div class="numero" id="dinero">$0</div>

</div>

<div class="card">

<h3>Comisiones</h3>

<div class="numero" id="comisiones">$0</div>

</div>

</div>

</main>

</div>
<script src="admin.js"></script>

<script>

const token=localStorage.getItem("tokenAdmin");
console.log(token); 

if(!token){

    window.location.href="admin-login.html";

}

const datos=JSON.parse(atob(token.split(".")[1]));

document.getElementById("adminNombre").innerText=datos.email;
cargarDashboard();

async function cargarDashboard(){

    try{

        const respuesta = await fetch("/admin/dashboard",{

            headers:{
                Authorization:"Bearer " + token
            }

        });

        if(!verificarSesion(respuesta)) return;

if(!respuesta.ok){

    alert("No fue posible cargar el Dashboard.");
    return;

}

        const datosDashboard = await respuesta.json();

        document.getElementById("adminNombre").innerText =
            datosDashboard.administrador;

        document.getElementById("usuarios").innerText =
            datosDashboard.estadisticas.usuarios;

        const totalTratos =
            datosDashboard.estadisticas.tratos_creados +
            datosDashboard.estadisticas.tratos_reservados +
            datosDashboard.estadisticas.tratos_completados;

        document.getElementById("tratos").innerText = totalTratos;
        document.getElementById("tratosCreados").innerText =
datosDashboard.estadisticas.tratos_creados;

document.getElementById("tratosReservados").innerText =
datosDashboard.estadisticas.tratos_reservados;

document.getElementById("tratosCompletados").innerText =
datosDashboard.estadisticas.tratos_completados;

        document.getElementById("dinero").innerText =
            "$" + Number(datosDashboard.estadisticas.dinero_protegido).toFixed(2);

        document.getElementById("comisiones").innerText =
            "$" + Number(datosDashboard.estadisticas.comisiones).toFixed(2);

    }catch(error){

        console.error(error);
        alert("Error al cargar el Dashboard.");

    }

}

function cerrarSesion(){

    localStorage.removeItem("tokenAdmin");

    window.location.href="admin-login.html";

}

</script>

</body>
</html>
