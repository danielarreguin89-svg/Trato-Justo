<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Compras - Trato Justo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#D6D9D8;
    min-height:100vh;
    color:#17212B;
}

/* =========================
   HEADER
========================= */

.header{
    background:
        linear-gradient(
            135deg,
            #15204B 0%,
            #263A9B 45%,
            #536DFE 100%
        );

    color:white;

    padding:28px 20px 38px;

    text-align:center;

    position:relative;

    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;

    box-shadow:
        0 15px 35px rgba(22,34,82,.22);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:30px;
    font-weight:700;

    margin-top:12px;
    margin-bottom:10px;

    letter-spacing:-.5px;
}
.logo-mark{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.24);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.logo-mark .material-icons{
    font-size:25px;
}

.subtitulo{
    font-size:15px;

    opacity:.88;

    max-width:600px;

    margin:auto;

    line-height:1.5;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:30px 20px 40px;
}

/* =========================
   BOTONES
========================= */

.btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:14px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s ease;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:scale(.98);
}

.btn-secondary{
    background:rgba(255,255,255,.55);
    color:#003087;
    border:1px solid rgba(255,255,255,.7);
    box-shadow:
        0 10px 25px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    margin-bottom:22px;
}

/* =========================
   TARJETAS
========================= */

.card{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    border-radius:26px;
    padding:22px;
    margin-bottom:15px;

    box-shadow:
        0 20px 45px rgba(0,0,0,.18),
        inset 0 1px 1px rgba(255,255,255,.30);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transition:
        transform .25s,
        box-shadow .25s;
}

.card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 17px 35px rgba(27,39,85,.12),
        inset 0 1px 0 rgba(255,255,255,.85);
}

.card h3{
    color:#003087;
    font-size:21px;
    margin-bottom:18px;
}

/* =========================
   INFORMACIÓN
========================= */

.info{
    margin-bottom:10px;
    color:#24313D;
    font-size:15px;
}

.info b{
    color:#17212B;
}

/* =========================
   CÓDIGO
========================= */

.codigo{
    display:inline-block;
    background:rgba(0,48,135,.10);
    color:#003087;
    padding:7px 12px;
    border-radius:10px;
    font-weight:bold;
    margin-left:4px;
    border:1px solid rgba(0,48,135,.10);
}

/* =========================
   ESTADOS
========================= */

.estado{
    display:inline-block;
    padding:7px 13px;
    border-radius:10px;
    font-weight:bold;
    margin-top:2px;
    font-size:14px;
    border:1px solid rgba(255,255,255,.6);
}

.estado-creado{
    background:rgba(255,193,7,.18);
    color:#765900;
}

.estado-reservado{
    background:rgba(40,167,69,.16);
    color:#17652B;
}

.estado-completado{
    background:rgba(0,158,227,.15);
    color:#005B84;
}

/* =========================
   BOTÓN VER TRATO
========================= */

.link-btn{
    display:block;
    width:100%;
    max-width:520px;
    margin:18px auto 0;

    text-align:center;
    text-decoration:none;

    color:#172033;

    background:rgba(255,255,255,.38);

    border:1px solid rgba(255,255,255,.98);

    border-radius:17px;

    padding:15px 18px;

    font-size:15px;
    font-weight:700;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 8px 20px rgba(30,40,60,.10),
        inset 0 1px 2px rgba(255,255,255,1),
        inset 0 -1px 2px rgba(140,150,160,.14);

    transition:.25s;
}

.link-btn:hover{
    transform:translateY(-2px);

    background:rgba(255,255,255,.52);

    box-shadow:
        0 12px 26px rgba(30,40,60,.13),
        inset 0 1px 2px rgba(255,255,255,1);
}

/* =========================
   VACÍO
========================= */

.vacio{
    background:rgba(255,255,255,.58);
    border:1px solid rgba(255,255,255,.72);
    padding:35px 25px;
    border-radius:22px;
    text-align:center;

    box-shadow:
        0 14px 30px rgba(0,0,0,.10),
        inset 0 1px 0 rgba(255,255,255,.8);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.vacio h3{
    color:#003087;
    margin-bottom:10px;
}

.vacio p{
    color:#394854;
}

/* =========================
   MOVIL
========================= */

@media (max-width:600px){

    .header{
        padding:22px 16px 32px;
    }

    .logo{
        font-size:25px;
    }

    .subtitulo{
        font-size:13px;
    }

    .container{
        padding:20px 12px 30px;
    }

    .card{
        padding:18px;
        border-radius:19px;
    }

    .card h3{
        font-size:19px;
    }

    .info{
        font-size:14px;
    }

    .codigo{
        display:block;
        width:max-content;
        margin:5px 0 0;
    }

    .link-btn{
        padding:12px;
    }

}
@media (max-width:600px){

    .card{
        padding:16px !important;
        margin-bottom:12px !important;
        border-radius:20px !important;
    }

    .card h3{
        font-size:18px !important;
        line-height:1.25 !important;
        margin-bottom:10px !important;
    }

    .card .info{
        margin-bottom:6px !important;
        font-size:13px !important;
        line-height:1.3 !important;
    }

    .card .codigo{
        padding:6px 10px !important;
        font-size:12px !important;
    }

    .card .estado{
        margin-top:2px !important;
        padding:6px 10px !important;
        font-size:12px !important;
    }

    .card .link-btn{
        margin-top:9px !important;
        padding:10px !important;
        font-size:13px !important;
    }

}
</style>
</head>

<body>

<div class="header">

    <div class="logo">

        <div class="logo-mark">

            <span class="material-icons">
                verified_user
            </span>

        </div>

        Trato Justo

    </div>

    <div class="subtitulo">
        Administra todos tus tratos como comprador
    </div>

</div>

<div class="container">

    <button
    class="btn btn-secondary"
    onclick="location.href='dashboard.html'">

    <span class="material-icons">
        arrow_back
    </span>

    Volver al Inicio

</button>

    <div id="compras">
        Cargando compras...
    </div>

</div>

<script>

const token = localStorage.getItem('token');

if (!token) {

    window.location.href = '/login.html';

}

cargarCompras();

async function cargarCompras() {

    try {

        const respuesta = await fetch(
            '/mis-compras',
            {
                headers: {
    Authorization: "Bearer " + token
}
            }
        );

        const compras = await respuesta.json();

        const contenedor =
            document.getElementById('compras');

        if (!respuesta.ok) {

            contenedor.innerHTML =
                JSON.stringify(compras);

            return;

        }

        if (compras.length === 0) {

            contenedor.innerHTML = `
                <div class="vacio">
                    <h3>No tienes compras registradas</h3>
                    <br>
                    <p>
                        Los tratos que reserves aparecerán aquí.
                    </p>
                </div>
            `;

            return;

        }

        let html = '';

        compras.forEach(trato => {

            let claseEstado = 'estado-creado';

            if (trato.estado === 'reservado') {

                claseEstado = 'estado-reservado';

            }

            if (trato.estado === 'completado') {

                claseEstado = 'estado-completado';

            }

            html += `

                <div class="card">

                    <h3>${trato.producto}</h3>

                    <div class="info">
                        <b>Código:</b>
                        <span class="codigo">
                            ${trato.codigo}
                        </span>
                    </div>

                    <div class="info">
                        <b>Monto protegido:</b>
                        $${Number(
                            trato.monto_protegido
                        ).toLocaleString('es-MX')} MXN
                    </div>

                    <div class="info">
                        <b>Estado:</b>
                    </div>

                    <div class="estado ${claseEstado}">
                        ${trato.estado}
                    </div>

                    <a
                        class="link-btn"
                        href="/trato/${trato.codigo}"
                        target="_blank">
                        Ver trato
                    </a>

                </div>

            `;

        });

        contenedor.innerHTML = html;

    } catch (error) {

        document.getElementById('compras').innerHTML =
            error.toString();

    }

}

</script>

</body>
</html>
