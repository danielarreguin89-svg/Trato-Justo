<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión - Trato Justo</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(83,109,254,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(38,58,155,.08),
            transparent 30%
        ),
        #D6D9D8;
}

.login-container{
    width:100%;
    max-width:400px;
    padding:20px;
}

@media (max-width:600px){
    .login-container{
        padding:16px;
    }

    .card{
        padding:26px 22px;
        border-radius:22px;
    }

    .logo{
        font-size:25px;
    }

    .logo-mark{
        width:40px;
        height:40px;
        border-radius:12px;
    }

    .logo-mark .material-icons{
        font-size:22px;
    }
}

.card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.68),
            rgba(255,255,255,.42)
        );

    border:1px solid rgba(255,255,255,.88);

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 18px 40px rgba(22,34,82,.09),
        inset 0 1px 1px rgba(255,255,255,.98);

    backdrop-filter:blur(24px) saturate(115%);
    -webkit-backdrop-filter:blur(24px) saturate(115%);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:28px;
    font-weight:700;

    color:#15204B;

    margin-bottom:10px;
}

.logo-mark{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    box-shadow:
        0 8px 20px rgba(38,58,155,.18),
        inset 0 1px 1px rgba(255,255,255,.25);
}

.logo-mark .material-icons{
    font-size:24px;
}

.subtitulo{
    text-align:center;
    color:#667085;
    font-size:14px;
    line-height:1.5;
    margin:6px 0 28px;
}

label{
    display:flex;
    align-items:center;
    gap:6px;

    margin-bottom:8px;

    font-size:14px;
    font-weight:700;
    color:#15204B;
}

label .material-icons{
    font-size:18px;
    color:#263A9B;
}

input{
    width:100%;
    padding:14px 15px;

    background:rgba(255,255,255,.58);

    border:1px solid rgba(255,255,255,.88);

    border-radius:14px;

    font-size:16px;
    color:#15204B;

    margin-bottom:20px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.75),
        0 4px 12px rgba(22,34,82,.04);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    transition:.2s ease;
}

input:focus{
    outline:none;

    border-color:#536DFE;

    box-shadow:
        0 0 0 3px rgba(83,109,254,.12),
        inset 0 1px 2px rgba(255,255,255,.75);
}

.btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 22px rgba(38,58,155,.20),
        inset 0 1px 1px rgba(255,255,255,.18);

    transition:.2s ease;
}

.btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 14px 26px rgba(38,58,155,.24),
        inset 0 1px 1px rgba(255,255,255,.22);
}

.btn:active{
    transform:translateY(0);
}
.recuperar{
    text-align:center;
    margin-top:15px;
}

.recuperar a{
    color:#263A9B;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.recuperar a:hover{
    text-decoration:underline;
}

.registro{
    text-align:center;
    margin-top:22px;
    color:#667085;
    font-size:14px;
}

.registro a{
    color:#263A9B;
    text-decoration:none;
    font-weight:700;
}

.registro a:hover{
    text-decoration:underline;
}

.registro{
    text-align:center;
    margin-top:20px;
}

.registro a{
    color:#009EE3;
    text-decoration:none;
    font-weight:bold;
}

.seguridad{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    margin-top:24px;

    color:#667085;
    font-size:13px;
}

.seguridad .material-icons{
    font-size:17px;
    color:#263A9B;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="card">

        <div class="logo">
    <div class="logo-mark">
        <span class="material-icons">
            verified_user
        </span>
    </div>

    Trato Justo
</div>

        <div class="subtitulo">
            Inicia sesión para acceder a tus tratos protegidos
        </div>

        <label>
    <span class="material-icons">mail</span>
    Correo electrónico
</label>

        <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com">

        <label>
    <span class="material-icons">lock</span>
    Contraseña
</label>

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña">

        <button
            class="btn"
            onclick="login()">
            Iniciar sesión
        </button>

<div class="recuperar">
    <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
</div>

        <div class="registro">
    ¿No tienes cuenta?
    <a href="registro.html">Regístrate aquí</a>
</div>

        <div class="seguridad">
    <span class="material-icons">lock</span>
    <span>Tu información está protegida</span>
</div>

    </div>

</div>

<script>

async function login() {

    console.log("Entró a login()");

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const respuesta = await fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            email,
            password
        })
    });

    const datos = await respuesta.json();

    console.log(respuesta.status);
console.log(datos);

    if (respuesta.ok) {

        localStorage.setItem(
            'token',
            datos.token
        );

        alert('Bienvenido a Trato Justo');

        window.location.href = '/dashboard.html';

    } else {

        alert(datos.error);

    }

}

</script>

</body>
</html>
