<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión - Trato Justo</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet" href="/login.css">
</head>

<body>

<div class="login-container">

    <div class="card">

        <div class="logo">
    <div class="logo-mark">
        <span class="material-icons">
            verified_user
        </span>
    </div>

    Trato Justo
</div>

        <div class="subtitulo">
            Inicia sesión para acceder a tus tratos protegidos
        </div>

        <label>
    <span class="material-icons">mail</span>
    Correo electrónico
</label>

        <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com">

        <label>
    <span class="material-icons">lock</span>
    Contraseña
</label>

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña">

      <button
    class="btn"
    id="btnLogin"
    type="button">
    Iniciar sesión
</button>

<div class="recuperar">
    <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
</div>

        <div class="registro">
    ¿No tienes cuenta?
    <a href="registro.html">Regístrate aquí</a>
</div>

        <div class="seguridad">
    <span class="material-icons">lock</span>
    <span>Tu información está protegida</span>
</div>

    </div>

</div>

<script src="csrf.js"></script>
<script src="login.js"></script>
</body>
</html>
