<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<title>Pago exitoso</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(83,109,254,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(38,58,155,.08),
            transparent 30%
        ),
        #D6D9D8;
}

.card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.68),
            rgba(255,255,255,.42)
        );

    backdrop-filter:blur(24px) saturate(115%);
    -webkit-backdrop-filter:blur(24px) saturate(115%);

    padding:40px 32px;

    border-radius:28px;

    border:1px solid rgba(255,255,255,.88);

    box-shadow:
        0 22px 50px rgba(22,34,82,.12),
        inset 0 1px 1px rgba(255,255,255,.98);

    width:430px;
    max-width:95%;

    text-align:center;

    animation:subir .8s ease;
}

.circulo{
    width:96px;
    height:96px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    box-shadow:
        0 0 0 10px rgba(83,109,254,.10),
        0 15px 35px rgba(38,58,155,.22);

    animation:pop .7s ease;
}

.circulo .material-icons{
    font-size:52px;
    font-weight:500;
}

h1{
    margin-top:24px;

    font-size:32px;
    line-height:1.2;

    color:#15204B;

    font-weight:700;

    opacity:0;

    animation:aparecer .6s forwards;
    animation-delay:.55s;
}

p{
    margin-top:16px;

    color:#667085;

    font-size:15px;
    line-height:1.6;

    opacity:0;

    animation:aparecer .6s forwards;
    animation-delay:.95s;
}

.info{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:18px;

    background:rgba(255,255,255,.38);

    border:1px solid rgba(255,255,255,.70);

    border-radius:15px;

    padding:14px;

    color:#667085;

    font-size:13px;
    line-height:1.4;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.85);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    opacity:0;

    animation:aparecer .6s forwards;
    animation-delay:1.2s;
}

.info .material-icons{
    flex-shrink:0;
    font-size:19px;
    color:#263A9B;
}

.botones{

margin-top:35px;

display:flex;

flex-direction:column;

gap:15px;

opacity:0;

animation:aparecer .6s forwards;
animation-delay:1.5s;

}

button{
    height:52px;

    border:none;
    border-radius:14px;

    cursor:pointer;

    font-size:16px;
    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    transition:.2s ease;
}

button .material-icons{
    font-size:20px;
}

.compras{
    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    position:relative;
    overflow:hidden;

    box-shadow:
        0 10px 22px rgba(38,58,155,.20),
        inset 0 1px 1px rgba(255,255,255,.18);
}
.compras::before{

content:"";

position:absolute;

top:0;

left:-120%;

width:70%;

height:100%;

background:rgba(255,255,255,.35);

transform:skewX(-25deg);

transition:.8s;

}
.compras:hover{
    transform:translateY(-1px);

    box-shadow:
        0 14px 26px rgba(38,58,155,.24),
        inset 0 1px 1px rgba(255,255,255,.22);
}

.compras:hover::before{

left:150%;

}

.inicio{
    background:rgba(255,255,255,.42);

    color:#263A9B;

    border:1px solid rgba(38,58,155,.18);

    box-shadow:
        0 8px 18px rgba(22,34,82,.06),
        inset 0 1px 1px rgba(255,255,255,.80);
}

.inicio:hover{
    background:rgba(255,255,255,.58);
}

@keyframes pop{

0%{

transform:scale(.2);

}

70%{

transform:scale(1.15);

}

100%{

transform:scale(1);

}

}

@keyframes aparecer{

to{

opacity:1;

}

}

@keyframes subir{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}
@keyframes dibujar{

to{

stroke-dashoffset:0;

}

}
.marca-pago{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:9px;

    margin-bottom:28px;

    font-size:20px;
    font-weight:700;
    color:#15204B;
}

.marca-pago .logo-mark{
    width:38px;
    height:38px;

    border-radius:12px;
}

.marca-pago .logo-mark .material-icons{
    font-size:21px;
}
@media (max-width:600px){
    body{
        padding:16px;
    }

    .card{
        padding:32px 22px;
        border-radius:24px;
        width:100%;
        max-width:400px;
    }

    .circulo{
        width:82px;
        height:82px;
    }

    .circulo .material-icons{
        font-size:44px;
    }

    h1{
        font-size:28px;
    }

    p{
        font-size:14px;
        line-height:1.55;
    }

    .info{
        font-size:12px;
        text-align:left;
    }
    .marca-pago{
    font-size:18px;
    margin-bottom:24px;
}

.marca-pago .logo-mark{
    width:34px;
    height:34px;
    border-radius:10px;
}

.marca-pago .logo-mark .material-icons{
    font-size:19px;
}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="card">
<div class="marca-pago">
    <div class="logo-mark">
        <span class="material-icons">verified_user</span>
    </div>
    <span>Trato Justo</span>
</div>
<div class="circulo">
    <span class="material-icons">check</span>
</div>

<h1>

¡Pago exitoso!

</h1>

<p>

Tu dinero quedó protegido por <b>Trato Justo.</b>

Ahora coordina la entrega con el vendedor y, cuando recibas el producto, podrás liberar el dinero de forma segura.

</p>

<div class="info">
    <span class="material-icons">lock</span>
    <span>Tu dinero permanecerá seguro hasta que confirmes la entrega.</span>
</div>

<div class="botones">

<button
class="compras"
onclick="location.href='mis-compras.html'">

<span class="material-icons">shopping_bag</span>
Ir a Mis Compras

</button>

<button
class="inicio"
onclick="location.href='dashboard.html'">

<span class="material-icons">home</span>
Volver al Inicio

</button>

</div>

</div>
<script>

function lanzarConfeti(){

    confetti({

        particleCount:180,

        spread:90,

        origin:{ y:0.6 }

    });

    setTimeout(()=>{

        const duracion=2500;

        const fin=Date.now()+duracion;

        (function frame(){

            confetti({

                particleCount:3,

                angle:60,

                spread:60,

                origin:{x:0},

                startVelocity:30

            });

            confetti({

                particleCount:3,

                angle:120,

                spread:60,

                origin:{x:1},

                startVelocity:30

            });

            if(Date.now()<fin){

                requestAnimationFrame(frame);

            }

        })();

    },250);

}

window.onload = () =>{

    if(navigator.vibrate){

        navigator.vibrate([120,50,120]);

    }

    setTimeout(lanzarConfeti,1400);

};

</script>
</body>
</html>
