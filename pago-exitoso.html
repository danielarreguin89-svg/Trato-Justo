<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<title>Pago exitoso</title>

<link rel="stylesheet" href="/pago-exitoso.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="card">
<div class="marca-pago">
    <div class="logo-mark">
        <span class="material-icons">verified_user</span>
    </div>
    <span>Trato Justo</span>
</div>
<div class="circulo">
    <span class="material-icons">check</span>
</div>

<h1>

¡Pago exitoso!

</h1>

<p>

Tu dinero quedó protegido por <b>Trato Justo.</b>

Ahora coordina la entrega con el vendedor y, cuando recibas el producto, podrás liberar el dinero de forma segura.

</p>

<div class="info">
    <span class="material-icons">lock</span>
    <span>Tu dinero permanecerá seguro hasta que confirmes la entrega.</span>
</div>

<div class="botones">

<button
class="compras"
data-accion="ir-mis-compras">

<span class="material-icons">shopping_bag</span>
Ir a Mis Compras

</button>

<button
class="inicio"
data-accion="ir-dashboard">

<span class="material-icons">home</span>
Volver al Inicio

</button>

</div>

</div>
<script src="/csrf.js"></script>
<script src="/pago-exitoso.js"></script>
</body>
</html>
