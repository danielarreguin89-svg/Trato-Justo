<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Datos Personales</title>
<link rel="stylesheet" href="/perfil.css">
</head>
<body>

<div class="header">
    <h1>Datos Personales</h1>
</div>

<div class="container">

    <div class="card">

        <div class="campo">
            <div class="label">Nombre</div>
            <input
                type="text"
                id="nombre"
                disabled>
        </div>

        <div class="campo">
            <div class="label">Correo</div>
            <input
                type="email"
                id="email"
                disabled>
        </div>

        <div class="campo">
            <div class="label">Teléfono</div>
            <input
                type="text"
                id="telefono"
                disabled>
        </div>

        <div class="campo">
            <div class="label">Fecha de nacimiento</div>
            <input
                type="date"
                id="fechaNacimiento"
                disabled>
        </div>

        <div id="mensaje"></div>

        <div class="botones">

            <button
                class="btn btnPrincipal"
                id="btnEditar">

                Editar datos

            </button>
            
            <button
                class="btn btnSecundario"
                id="btnCancelar">

                Cancelar

            </button>

        </div>

        <button
            class="btn btnPrincipal"
            id="btnGuardar"
            disabled>

            Guardar cambios

        </button>

        <button
            class="btn btnSecundario"
            data-accion="ir-dashboard">

            Volver al Inicio

        </button>

    </div>

</div>

<script src="/csrf.js"></script>
<script src="/perfil.js"></script>
</body>
</html>
