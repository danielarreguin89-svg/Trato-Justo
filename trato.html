<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trato Justo</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#D6D9D8 !important;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#009EE3,#003087);
    color:white;
    text-align:center;
    padding:40px 20px;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.subtitulo{
    margin-top:10px;
    opacity:.9;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.68),
            rgba(255,255,255,.42)
        );

    border:1px solid rgba(255,255,255,.88);

    border-radius:24px;

    padding:26px;

    margin-bottom:20px;

    box-shadow:
        0 18px 40px rgba(22,34,82,.09),
        inset 0 1px 1px rgba(255,255,255,.98),
        inset 0 -1px 1px rgba(255,255,255,.35);

    backdrop-filter:blur(24px) saturate(115%);
    -webkit-backdrop-filter:blur(24px) saturate(115%);

    color:#172022;
}

.producto{
    color:#15204B !important;
    margin-bottom:14px;
    font-size:28px;
    font-weight:700;
    letter-spacing:-.5px;
}

.monto{
    font-size:34px;
    font-weight:800;
    color:#263A9B !important;
    margin-top:8px;
    letter-spacing:-1px;
}

.info{
    margin-bottom:14px;
    color:#667085;

    font-size:14px;
    line-height:1.5;
}

.info b{
    color:#172033;
    font-weight:700;
}
.rating{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;

    gap:5px;

    color:#667085;

    font-size:14px;

    margin-top:-4px;
    margin-bottom:8px;
}

.rating .material-icons{
    font-size:18px;
    color:#F4B942;
}

.rating strong{
    color:#15204B;
    font-weight:700;
}

.codigo{
    display:inline-flex;
    align-items:center;

    background:rgba(38,58,155,.07);

    color:#263A9B;

    padding:7px 12px;

    border-radius:10px;

    border:1px solid rgba(38,58,155,.12);

    font-size:13px;
    font-weight:700;

    letter-spacing:.4px;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.95);
}

.estado{
    display:inline-flex;
    align-items:center;

    padding:7px 12px;

    border-radius:10px;

    font-size:13px;
    font-weight:700;

    letter-spacing:.2px;

    border:1px solid transparent;
}

/* CREADO */
.estado-creado{
    background:rgba(244,185,66,.12);
    color:#80652E;
    border-color:rgba(244,185,66,.22);
}

/* RESERVADO */
.estado-reservado{
    background:rgba(34,197,94,.10);
    color:#176B50;
    border-color:rgba(34,197,94,.18);
}

/* COMPLETADO */
.estado-completado{
    background:rgba(38,58,155,.10);
    color:#263A9B;
    border-color:rgba(38,58,155,.18);
}

.btn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    border:1px solid rgba(38,58,155,.35);

    box-shadow:
        0 10px 24px rgba(38,58,155,.20),
        inset 0 1px 1px rgba(255,255,255,.20);
}

.btn-success{
    background:
        linear-gradient(
            135deg,
            #263A9B,
            #15204B
        );

    color:white;

    border:1px solid rgba(38,58,155,.35);

    box-shadow:
        0 10px 24px rgba(38,58,155,.20),
        inset 0 1px 1px rgba(255,255,255,.20);
}
.btn-secondary{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.90),
            rgba(255,255,255,.62)
        );

    color:#263A9B;

    border:1px solid rgba(38,58,155,.12);

    box-shadow:
        0 8px 20px rgba(22,34,82,.08),
        inset 0 1px 1px rgba(255,255,255,.95);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn-secondary .material-icons{
    font-size:20px;
}

.seguridad{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;

    background:
        linear-gradient(
            135deg,
            rgba(245,185,66,.12),
            rgba(255,255,255,.52)
        );

    border:1px solid rgba(244,185,66,.25);

    border-radius:16px;

    padding:16px;

    margin-top:18px;

    color:#5F4B20;

    font-size:14px;
    line-height:1.5;

    box-shadow:
        0 8px 20px rgba(22,34,82,.05),
        inset 0 1px 1px rgba(255,255,255,.95);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}
.seguridad-icon{
    font-size:22px;
    color:#B7791F;
    margin-top:1px;
    flex-shrink:0;
}

.codigo-box{
    background:
        linear-gradient(
            135deg,
            rgba(38,58,155,.10),
            rgba(255,255,255,.55)
        );

    border:1px solid rgba(38,58,155,.18);

    border-radius:20px;

    padding:16px;

    text-align:center;

    margin:12px 0;

    box-shadow:
        0 12px 28px rgba(22,34,82,.08),
        inset 0 1px 1px rgba(255,255,255,.95);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.codigo-box p{
    color:#667085;
    font-size:13px;
    font-weight:600;
    margin-bottom:9px;
}

.codigo-box h2{
    color:#15204B;
    font-size:34px;
    font-weight:800;
    letter-spacing:3px;
}

.input{
    width:100%;

    padding:15px 16px;

    background:rgba(255,255,255,.58);

    border:1px solid rgba(255,255,255,.90);

    border-radius:14px;

    color:#15204B;

    font-size:16px;
    font-weight:600;

    outline:none;

    margin-top:8px;
    margin-bottom:6px;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.95),
        0 6px 16px rgba(22,34,82,.05);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.input::placeholder{
    color:#7B8494;
    font-weight:400;
}

.input:focus{
    border-color:rgba(38,58,155,.45);

    box-shadow:
        0 0 0 3px rgba(38,58,155,.10),
        inset 0 1px 1px rgba(255,255,255,.95);
}

.loading{
    text-align:center;
    padding:50px;
}
.estrella{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:46px;
    height:46px;

    font-size:32px;
    line-height:1;

    color:#CBD5E1;

    cursor:pointer;

    margin:0 3px;

    transition:
        transform .2s ease,
        color .2s ease;
}

.estrella:hover{
    transform:scale(1.12);
    color:#F4B942;
}
.estrella.seleccionada{
    color:#F4B942;
}

<body>

<div class="header">

    <div class="logo">
        <div class="logo-mark">
            <span class="material-icons">verified_user</span>
        </div>
        Trato Justo
    </div>

    <div class="subtitulo">
        Compra y vende con pagos protegidos
    </div>

</div>

<div class="container">

    <div id="contenido" class="loading">
        Cargando trato...
    </div>

</div>
<script src="https://js.stripe.com/v3/"></script>
<script>

const codigo =
    window.location.pathname.split('/').pop();

const token =
    localStorage.getItem('token');
    console.log("TOKEN:", token);
    const stripe = Stripe("pk_test_51Tvt9e17UsHd7j3WlfulSADQ9Fu5NqvY2Drs64zeuTijOVS29VuPwqjkwzZOyH3kVKt3lWoVeE1NFiEOw1m6RD9800J0K1PAH8");
let estrellasSeleccionadas = 0;

function seleccionarEstrella(cantidad) {

    estrellasSeleccionadas = cantidad;

    const estrellas =
        document.querySelectorAll('.estrella');

    estrellas.forEach((estrella, index) => {

        estrella.textContent =
    index < cantidad ? '★' : '☆';

estrella.classList.toggle(
    'seleccionada',
    index < cantidad
);

    });

}

function enviarCalificacion() {

    if (estrellasSeleccionadas === 0) {

        alert(
            'Selecciona una calificación'
        );

        return;

    }

    calificar(estrellasSeleccionadas);

}
async function reservarTrato() {

    try {

        const respuesta = await fetch(
            "/stripe/create-checkout-session",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                     "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    codigo
                })
            }
        );

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(datos.error);
        }

        const resultado = await stripe.redirectToCheckout({

            sessionId: datos.sessionId

        });

        if (resultado.error) {

            alert(resultado.error.message);

        }

    } catch (error) {

        console.log(error);

        alert(error.message);

    }

}
async function calificar(estrellas) {

    const respuesta =
        await fetch(
            `/calificar/${codigo}`,
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body:JSON.stringify({
                    estrellas
                })
            }
        );

    const datos =
        await respuesta.json();

    alert(
        datos.mensaje ||
        datos.error
    );

    location.reload();

}
async function cargarTrato() {

    const respuesta =
        await fetch(
            `/api/trato/${codigo}`,
            {
                headers:{
                    'Authorization': 'Bearer ' + token
                }
            }
        );

    const trato =
        await respuesta.json();

   let claseEstado = 'estado-creado';

if (trato.estado === 'reservado') {
    claseEstado = 'estado-reservado';
}

if (trato.estado === 'completado') {
    claseEstado = 'estado-completado';
}
document.getElementById(
    'contenido'
).innerHTML = `

    <div class="card">

        <h2 class="producto">
            ${trato.producto}
        </h2>

        <div class="monto">
            $${Number(
                trato.monto_protegido
            ).toLocaleString('es-MX')}
        </div>

        <div style="height:8px;"></div>

        <div class="info">
            <b>Vendedor:</b>
            ${trato.vendedor_nombre || 'No disponible'}
        </div>

        <div class="info rating">
    <span class="material-icons">star</span>
    <strong>${trato.comprador_rating || 0}</strong>
    <span>(${trato.comprador_total_calificaciones || 0} calificaciones)</span>
</div>

      ${trato.esVendedor && trato.comprador_nombre ? `

<div class="info">
    <b>Comprador:</b>
    ${trato.comprador_nombre}
</div>

<div class="info rating">
    <span class="material-icons">star</span>
    <strong>${trato.vendedor_rating || 0}</strong>
    <span>(${trato.vendedor_total_calificaciones || 0} calificaciones)</span>
</div>

` : ''}

        <div class="info">
            <b>Descripción:</b>
            ${trato.descripcion}
        </div>

        <div class="info estado-row">

    <b>Estado</b>

    <span class="estado ${claseEstado}">
        ${
            trato.estado === 'creado'
                ? 'Creado'
                : trato.estado === 'reservado'
                ? 'Reservado'
                : 'Completado'
        }
    </span>

</div>

        <div class="info">
            <b>Código:</b>
            <span class="codigo">
                ${trato.codigo}
            </span>
        </div>

        <div class="separador-trato"></div>

        ${trato.esVendedor ? `

<div class="resumen-financiero">

    <div class="resumen-item">
        <span>Comisión Trato Justo</span>
        <strong>
            $${Number(
                trato.comision || 0
            ).toLocaleString('es-MX')}
        </strong>
    </div>

    <div class="resumen-item">
        <span>Monto neto vendedor</span>
        <strong>
            $${Number(
                trato.monto_vendedor || 0
            ).toLocaleString('es-MX')}
        </strong>
    </div>

</div>

` : ''}

        ${trato.estado === 'creado' ? `

<div class="card">

    <h2 class="section-title">
    <span class="material-icons">inventory_2</span>
    Trato disponible
</h2>

    <br>

    <p>
        Este trato aún no ha sido reservado.
    </p>

    <br>

    ${trato.esVendedor ? `

<button
    class="btn btn-primary"
    onclick="window.location.href='/dashboard.html'">

     Volver al inicio

</button>

` : `

<button
    class="btn btn-primary"
    onclick="reservarTrato()">

    <span class="material-icons">lock</span>
    Reservar trato

</button>

`}

</div>

` : ''}
${trato.estado === 'reservado' ? `

<div class="card">

    <h2 class="section-title">
    <span class="material-icons">handshake</span>
    Trato reservado
</h2>

    <br>

    ${trato.esVendedor ? `

        <p>
            Espera a que el comprador reciba el producto y te proporcione el código de liberación.
        </p>

        <div class="campo-codigo">

    <label for="codigoLiberacion">
        Código de liberación
    </label>

    <input
        id="codigoLiberacion"
        class="input"
        type="text"
        placeholder="Ingresa el código">

    <span class="ayuda-codigo">
        Escribe el código que te proporcionó el comprador.
    </span>

</div>

        <button
    class="btn btn-success"
    onclick="liberarPago()">

    <span class="material-icons">lock_open</span>
    Liberar pago

</button>
        <button
    class="btn btn-secondary"
    onclick="window.location.href='/dashboard.html'">

    <span class="material-icons">arrow_back</span>
    Volver al Inicio

</button>

    ` : `

        <div class="seguridad">

    <span class="material-icons seguridad-icon">
        warning
    </span>

    <div>
        <b>Importante</b>

        <p>
            No compartas este código hasta que tengas el producto
            en tus manos y estés conforme con la compra.
        </p>
    </div>

</div>

        <div class="codigo-box">

            <p>Tu código de liberación es:</p>

            <h2>${trato.codigo_liberacion}</h2>

        </div>
        <button
    class="btn btn-secondary"
    onclick="window.location.href='/dashboard.html'">

    <span class="material-icons">arrow_back</span>
    Volver al Inicio

</button>

    `}

</div>

` : ''}
${trato.estado === 'completado' ? `

<div class="card">

    <h2 class="section-title">
    <span class="material-icons">check_circle</span>
    Trato completado
</h2>

    <br>

    <p>
        El pago fue liberado exitosamente al vendedor.
    </p>

    <br>

    ${trato.yaCalifico ? `

        <div class="calificacion-completada">

    <span class="material-icons">
        check_circle
    </span>

    <span>
        Ya calificaste este trato
    </span>

</div>

        <br>

        <button
    class="btn btn-secondary"
    onclick="window.location.href='/dashboard.html'">

    <span class="material-icons">arrow_back</span>
    Volver al Inicio

</button>

    ` : `
