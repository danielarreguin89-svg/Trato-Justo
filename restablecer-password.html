<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Restablecer contraseña | Trato Justo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f6f9;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

background:white;

width:430px;

padding:40px;

border-radius:12px;

box-shadow:0 2px 15px rgba(0,0,0,.15);

}

h1{

text-align:center;

color:#1976d2;

margin-bottom:15px;

}

p{

text-align:center;

margin-bottom:30px;

color:#666;

}

input{

width:100%;

padding:14px;

margin-bottom:20px;

border:1px solid #ccc;

border-radius:6px;

font-size:15px;

}

button{

width:100%;

padding:14px;

background:#1976d2;

color:white;

border:none;

border-radius:6px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#1565c0;

}

</style>

</head>

<body>

<div class="card">

<h1>Nueva contraseña</h1>

<p>

Escribe tu nueva contraseña.

</p>

<input

type="password"

id="password"

placeholder="Nueva contraseña">

<input

type="password"

id="confirmar"

placeholder="Confirmar contraseña">

<button

onclick="guardarPassword()">

Guardar contraseña

</button>

</div>

<script>

const parametros = new URLSearchParams(window.location.search);

const token = parametros.get("token");

async function guardarPassword(){

    const password =
        document.getElementById("password").value.trim();

    const confirmar =
        document.getElementById("confirmar").value.trim();

    if(password==="" || confirmar===""){

        alert("Completa todos los campos.");

        return;

    }

    if(password!==confirmar){

        alert("Las contraseñas no coinciden.");

        return;

    }

    try{

        const respuesta = await fetch("/restablecer-password",{

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify({

                token,

                password

            })

        });

        const datos = await respuesta.json();

        alert(datos.mensaje || datos.error);

        if(respuesta.ok){

            window.location.href="login.html";

        }

    }

    catch(error){

        console.error(error);

        alert("No fue posible conectar con el servidor.");

    }

}

</script>

</body>

</html>
