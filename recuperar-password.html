<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar contraseña | Trato Justo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

background:white;
width:420px;
padding:40px;
border-radius:12px;
box-shadow:0 2px 15px rgba(0,0,0,.15);

}

h1{

text-align:center;
margin-bottom:15px;
color:#1976d2;

}

p{

text-align:center;
margin-bottom:30px;
color:#666;

}

input{

width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:6px;
margin-bottom:20px;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#1976d2;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;

}

button:hover{

background:#1565c0;

}

a{

display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#1976d2;

}

</style>

</head>

<body>

<div class="card">

<h1>¿Olvidaste tu contraseña?</h1>

<p>

Ingresa el correo con el que te registraste.

Te enviaremos un enlace para crear una nueva contraseña.

</p>

<input
type="email"
id="correo"
placeholder="Correo electrónico">

<button
onclick="recuperarPassword()">

Enviar enlace

</button>

<a href="login.html">

Volver al inicio de sesión

</a>

</div>

<script>

async function recuperarPassword(){

    const email = document.getElementById("correo").value.trim();

    if(email===""){

        alert("Ingresa tu correo electrónico.");

        return;

    }

    try{

        const respuesta = await fetch("/recuperar-password",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email
            })

        });

        const datos = await respuesta.json();

        alert(datos.mensaje || datos.error);

        if(respuesta.ok){

            document.getElementById("correo").value="";

        }

    }

    catch(error){

        console.error(error);

        alert("No fue posible conectar con el servidor.");

    }

}

</script>

</body>

</html>
