<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Código</title>

<link rel="stylesheet" href="/verificar-codigo.css">

</head>
<body>

<div class="card">

    <h2>Verificar correo</h2>

    <p>Ingresa el código que recibiste por correo.</p>

    <input
        type="text"
        id="codigo"
        placeholder="Código de 6 dígitos">

    <button data-accion="verificar-codigo">
        Verificar
    </button>
<button data-accion="reenviar-codigo">
    Reenviar código
</button>
</div>

<script src="/csrf.js"></script>
<script src="/verificar-codigo.js"></script>
</body>
</html>
