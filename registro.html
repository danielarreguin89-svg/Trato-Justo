<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<title>Registro - Trato Justo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(83,109,254,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(38,58,155,.08),
            transparent 30%
        ),
        #D6D9D8;
}

.registro-container{
    width:100%;
    max-width:420px;
    padding:20px;
}

@media (max-width:600px){
body{
    align-items:flex-start;
    padding:20px 0;
}
    .registro-container{
        padding:16px;
    }

    .card{
        padding:26px 22px;
        border-radius:22px;
    }

    .logo{
        font-size:25px;
    }

    .logo-mark{
        width:40px;
        height:40px;
        border-radius:12px;
    }

    .logo-mark .material-icons{
        font-size:22px;
    }
}

.card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.68),
            rgba(255,255,255,.42)
        );

    border:1px solid rgba(255,255,255,.88);

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 18px 40px rgba(22,34,82,.09),
        inset 0 1px 1px rgba(255,255,255,.98);

    backdrop-filter:blur(24px) saturate(115%);
    -webkit-backdrop-filter:blur(24px) saturate(115%);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:28px;
    font-weight:700;

    color:#15204B;

    margin-bottom:10px;
}

.logo-mark{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;

    box-shadow:
        0 8px 20px rgba(38,58,155,.18),
        inset 0 1px 1px rgba(255,255,255,.25);
}

.logo-mark .material-icons{
    font-size:24px;
}

.subtitulo{
    text-align:center;
    color:#667085;
    font-size:14px;
    line-height:1.5;
    margin:6px 0 28px;
}

label{
    display:flex;
    align-items:center;
    gap:6px;

    margin-bottom:8px;

    font-size:14px;
    font-weight:700;

    color:#15204B;
}

label .material-icons{
    font-size:18px;
    color:#263A9B;
}

input{
    width:100%;
    padding:14px 15px;

    background:rgba(255,255,255,.58);

    border:1px solid rgba(255,255,255,.88);

    border-radius:14px;

    font-size:16px;
    color:#15204B;

    margin-bottom:20px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.75),
        0 4px 12px rgba(22,34,82,.04);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    transition:.2s ease;
}

input:focus{
    outline:none;

    border-color:#536DFE;

    box-shadow:
        0 0 0 3px rgba(83,109,254,.12),
        inset 0 1px 2px rgba(255,255,255,.75);
}

.btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:14px;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 22px rgba(38,58,155,.18),
        inset 0 1px 1px rgba(255,255,255,.18);

    transition:.2s ease;
}

.btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 14px 26px rgba(38,58,155,.22),
        inset 0 1px 1px rgba(255,255,255,.22);
}

.btn:active{
    transform:translateY(0);
}
.btn .material-icons{
    vertical-align:middle;
    font-size:19px;
    margin-right:6px;
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #536DFE,
            #263A9B
        );

    color:white;
}

.btn-secondary{
    background:rgba(255,255,255,.42);

    color:#263A9B;

    border:1px solid rgba(38,58,155,.18);

    margin-top:12px;
}

.login{
    text-align:center;
    margin-top:22px;
    color:#667085;
    font-size:14px;
}

.login a{
    color:#263A9B;
    text-decoration:none;
    font-weight:700;
}

.login a:hover{
    text-decoration:underline;
}

.seguridad{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    margin-top:24px;

    color:#667085;
    font-size:13px;
}

.seguridad .material-icons{
    font-size:17px;
    color:#263A9B;
}

.telefono-container{
    display:flex;
    margin-bottom:20px;
}

.prefijo{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:14px;

    background:rgba(255,255,255,.42);

    border:1px solid rgba(255,255,255,.88);
    border-right:none;

    border-radius:14px 0 0 14px;

    min-width:70px;

    text-align:center;

    font-size:16px;
    font-weight:600;
    color:#15204B;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.75);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.telefono-input{
    margin-bottom:0;

    border-radius:0 14px 14px 0;

    border-left:1px solid rgba(255,255,255,.60);
}

</style>
</head>

<body>

<div class="registro-container">

    <div class="card">

        <div class="logo">
    <div class="logo-mark">
        <span class="material-icons">
            verified_user
        </span>
    </div>

    Trato Justo
</div>

        <div class="subtitulo">
            Crea tu cuenta y comienza a realizar tratos protegidos
        </div>

        <label>
    <span class="material-icons">person</span>
    Nombre completo
</label>

        <input
            type="text"
            id="nombre"
            placeholder="Ingresa tu nombre">

        <label>
    <span class="material-icons">mail</span>
    Correo electrónico
</label>

        <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com">

        <label>
    <span class="material-icons">phone</span>
    Teléfono
</label>

        <div class="telefono-container">

            <div class="prefijo">
                +52
            </div>

            <input
                type="tel"
                id="telefono"
                class="telefono-input"
                placeholder="4621234567"
                maxlength="10">

        </div>
<label>
    <span class="material-icons">calendar_today</span>
    Fecha de nacimiento
</label>

<input
    type="date"
    id="fechaNacimiento">
        <label>
    <span class="material-icons">lock</span>
    Contraseña
</label>

        <input
            type="password"
            id="password"
            placeholder="Crea una contraseña">

        <label>
    <span class="material-icons">lock_outline</span>
    Confirmar contraseña
</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirma tu contraseña">

       <button
    class="btn btn-primary"
    onclick="registrar()">
    <span class="material-icons">person_add</span>
    Crear cuenta
</button>

        <button
    class="btn btn-secondary"
    onclick="location.href='login.html'">
    <span class="material-icons">login</span>
    Ya tengo cuenta
</button>

        <div class="seguridad">
    <span class="material-icons">lock</span>
    <span>Tus datos están protegidos</span>
</div>

    </div>

</div>

<script>

async function registrar() {

    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const fechaNacimiento = document.getElementById('fechaNacimiento').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!nombre || !email || !telefono || !fechaNacimiento || !password || !confirmPassword) {
        alert('Completa todos los campos');
        return;
    }

    if (telefono.length !== 10) {
        alert('El teléfono debe tener 10 dígitos');
        return;
    }

    const hoy = new Date();
    const nacimiento = new Date(fechaNacimiento);

    let edad = hoy.getFullYear() - nacimiento.getFullYear();

    const mes = hoy.getMonth() - nacimiento.getMonth();

    if (
        mes < 0 ||
        (mes === 0 && hoy.getDate() < nacimiento.getDate())
    ) {
        edad--;
    }

    if (edad < 18) {
        alert('Debes ser mayor de edad para utilizar Trato Justo');
        return;
    }

    if (password !== confirmPassword) {
        alert('Las contraseñas no coinciden');
        return;
    }

    const respuesta = await fetch('/registro', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            nombre,
            email,
            telefono: '+52' + telefono,
            fecha_nacimiento: fechaNacimiento,
            password
        })
    });

    const datos = await respuesta.json();

    if (respuesta.ok) {

    localStorage.setItem('email_verificacion', email);

    alert('Te enviamos un código de verificación a tu correo');

    window.location.href = '/verificar-codigo.html';

} else {

        alert(datos.error);

    }

}

</script>

</body>
</html>
